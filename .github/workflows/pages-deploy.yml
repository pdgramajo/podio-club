name: Deploy a GitHub Pages

# Dependencia CI -> Deploy: este workflow NO reacciona a push directamente.
# Se dispara únicamente cuando el workflow `CI` completa su ejecución sobre la
# rama main; el guard `if` del job confirma que esa ejecución terminó con
# éxito (los 4 jobs: lint, format, test y build).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    # workflow_run fires on completion (success or failure). Deploy only when
    # the whole CI workflow ended successfully on main, or on manual dispatch.
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # El deploy reconstruye el proyecto (npm ci + build) y publica dist/,
      # por lo que no depende de artefactos subidos por CI.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
